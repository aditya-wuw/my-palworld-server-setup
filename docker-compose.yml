services:
  backup-api:
    build: ./BackupAPI
    container_name: server-backup-api
    volumes:
      - "./palworld/backups:/backups"
    ports:
      - "3000:3000"
    environment:
      - UPLOAD_PATH=${BACKUP_UPLOAD_END_POINT}
      - API_PORT=${SERVER_API_PORT}
      - PASSWORD=${SERVER_ADMIN_PASS}
    networks:
      - game-net
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    container_name: palworld-server
    restart: unless-stopped
    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
      - "8212:8212/tcp"
    environment:
      - PUID=1000
      - PGID=1000
      - PORT=8211
      - PLAYERS=8
      - REST_API_ENABLED=true # <-- Enable the API
      - REST_API_PORT=${SERVER_API_PORT}
      - SERVER_NAME=PongoPal Island
      - SERVER_PASSWORD=${SERVER_PASS}
      - ADMIN_PASSWORD=${SERVER_ADMIN_PASS}
      - UPDATE_ON_BOOT=false
      # only run this for the 1st time get download the latest version
      #- UPDATE_ON_BOOT=True
      - BACKUP_ENABLED=true
      - BACKUP_CRON_EXPRESSION=0 * * * * #generate backup every hour
      # - BACKUP_CRON_EXPRESSION=*/1 * * * * #for testing
    volumes:
      - ./palworld:/palworld/
    networks:
      game-net:
        ipv4_address: 172.25.0.5
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: playit
    restart: unless-stopped
    environment:
      - SECRET_KEY=${PLAY_IT_SECRET_KEY}
    network_mode: host

networks:
  game-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
